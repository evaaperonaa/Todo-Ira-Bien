<header class="header">

  <!-- LOGO -->

  <!-- LOGOTIPOS -->
  <div class="brand-group">

    <!-- Logo original, a la izquierda -->
    <a class="brand" routerLink="/" aria-label="Ir a inicio">
      <img src="/logo.png" alt="Logo de la consulta" class="brand-logo brand-logo-original">
    </a>

    <!-- Logo Todo Irá Bien, a la derecha -->
    <a class="brand" routerLink="/" aria-label="Ir a inicio">
      <img src="/todoirabien.png" alt="Todo Irá Bien" class="brand-logo brand-logo-todo">
    </a>

  </div>


  <!-- NAVEGACIÓN -->
  <nav class="navigation" aria-label="Navegación principal">

    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'NAV.HOME' | translate }}
    </a>

    <a routerLink="/especialidades" routerLinkActive="active">
      {{ 'NAV.SPECIALTIES' | translate }}
    </a>

    <a routerLink="/como-trabajo" routerLinkActive="active">
      {{ 'NAV.HOW_I_WORK' | translate }}
    </a>

  </nav>

  <!-- ACCIONES -->
  <div class="header-actions">

    <!-- SELECTOR DE IDIOMA -->
    <div class="language-selector">

      <button type="button" class="language-button" (click)="alternarMenuIdiomas()"
        [attr.aria-expanded]="menuIdiomasAbierto" aria-label="Cambiar idioma">

        @if (idiomaActual === 'es') {

        <span class="flag flag-spain" aria-hidden="true"></span>

        <span class="language-code">ES</span>

        } @else {

        <span class="flag flag-valencia" aria-hidden="true">
          <span class="blue-stripe"></span>
          <span class="yellow-stripe"></span>
          <span class="red-stripes"></span>
        </span>

        <span class="language-code">VA</span>

        }

      </button>

      <!-- MENÚ DE IDIOMAS -->
      @if (menuIdiomasAbierto) {

      <div class="language-menu">

        <!-- CASTELLANO -->
        <button type="button" (click)="cambiarIdioma('es')" [class.selected]="idiomaActual === 'es'">

          <span class="flag flag-spain" aria-hidden="true"></span>

          <span>Castellano</span>

        </button>

        <!-- VALENCIANO -->
        <button type="button" (click)="cambiarIdioma('va')" [class.selected]="idiomaActual === 'va'">

          <span class="flag flag-valencia" aria-hidden="true">
            <span class="blue-stripe"></span>
            <span class="yellow-stripe"></span>
            <span class="red-stripes"></span>
          </span>

          <span>Valencià</span>

        </button>

      </div>

      }

    </div>

    <!-- BOTÓN PEDIR CITA -->
    <a class="appointment-button" routerLink="/cita">
      {{ 'NAV.APPOINTMENT' | translate }}
    </a>

  </div>

</header>
